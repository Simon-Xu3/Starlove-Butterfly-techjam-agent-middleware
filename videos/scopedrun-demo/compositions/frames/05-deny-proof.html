    (() => {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const hackerWrap = document.getElementById("frame-05-deny-proof-hacker-wrap");
      const target = hackerWrap.dataset.target;
      const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";
      const pseudoGlyph = (seed) => {
        const hash = ((seed * 9301 + 49297) % 233280) / 233280;
        return glyphs[Math.floor(hash * glyphs.length)];
      };
      const characters = [...target].map((character) => {
        const span = document.createElement("span");
        span.dataset.hackerChar = "";
        span.dataset.target = character;
        span.textContent = character;
        span.style.opacity = "0";
        span.style.transform = "rotateX(90deg)";
        hackerWrap.appendChild(span);
        return span;
      });

      tl.fromTo("#frame-05-deny-proof-meta", { opacity: 0, y: -22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);
      tl.fromTo("#frame-05-deny-proof-title", { opacity: 0, y: -48 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.1);
      tl.fromTo("#frame-05-deny-proof-panel-left", { opacity: 0, x: -340, rotateY: 24, scale: 0.86 }, { opacity: 1, x: 0, rotateY: 13, scale: 1, duration: 1.15, ease: "power3.out" }, 1.8);
      tl.fromTo("#frame-05-deny-proof-panel-right", { opacity: 0, x: 340, rotateY: -24, scale: 0.86 }, { opacity: 1, x: 0, rotateY: -13, scale: 1, duration: 1.15, ease: "power3.out" }, 2.02);
      tl.fromTo("#frame-05-deny-proof-panel-left [data-panel-title], #frame-05-deny-proof-panel-left [data-panel-result]", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.65, stagger: 0.14, ease: "power2.out" }, 2.45);
      tl.fromTo("#frame-05-deny-proof-panel-right [data-panel-title], #frame-05-deny-proof-panel-right [data-panel-result]", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.65, stagger: 0.14, ease: "power2.out" }, 2.7);
      tl.fromTo("#frame-05-deny-proof-advisor-bar", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.25);
      tl.fromTo("#frame-05-deny-proof-advisor-query", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.65, ease: "power3.out" }, 5.0);
      tl.fromTo("#frame-05-deny-proof-advisor-result", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" }, 7.0);
      tl.fromTo("#frame-05-deny-proof-http", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 9.0);

      characters.forEach((element, index) => {
        const state = { progress: 0 };
        tl.to(state, {
          progress: 1,
          duration: 0.72,
          ease: "power3.out",
          onUpdate: () => {
            const progress = state.progress;
            if (progress < 0.62) {
              const quantized = Math.floor(progress * 18);
              element.textContent = pseudoGlyph(index * 1000 + quantized);
            } else {
              element.textContent = element.dataset.target;
            }
            element.style.transform = `rotateX(${90 - progress * 90}deg)`;
            element.style.opacity = `${Math.min(1, progress * 2)}`;
          }
        }, 10.5 + index * 0.055);
      });

      tl.fromTo("#frame-05-deny-proof-panel-right [data-panel-result]", { color: "#9baea7" }, { color: "#ff5c57", duration: 0.55, ease: "power1.out" }, 12.7);
      tl.fromTo("#frame-05-deny-proof-never", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 15.2);

      const glowWords = Array.from(document.querySelectorAll("#frame-05-deny-proof-never [data-glow-word]"));
      const timings = {
        gate: { start: 0.0, end: 1.6 },
        runner: { start: 2.0, end: 4.7 }
      };
      const glowDriver = { t: 0 };
      const envelope = (time, start, end) => {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / 0.18, 1);
        if (time < end + 0.42) return 1 - ((time - end) / 0.42) * 0.86;
        return 0.14;
      };
      const lerp = (from, to, amount) => Math.round(from + (to - from) * amount);
      tl.to(glowDriver, {
        t: 6.3,
        duration: 6.3,
        ease: "none",
        onUpdate: () => {
          glowWords.forEach((element) => {
            const timing = timings[element.dataset.glowWord];
            const env = envelope(glowDriver.t, timing.start, timing.end);
            element.style.color = `rgb(${lerp(116, 255, env)}, ${lerp(132, 92, env)}, ${lerp(126, 87, env)})`;
            element.style.textShadow = `0 0 ${36 * env}px rgba(255, 92, 87, ${0.62 * env})`;
            element.style.transform = `scale(${1 + 0.13 * env})`;
          });
        }
      }, 15.2);
